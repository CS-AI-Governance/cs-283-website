# --- Site ---
title: "CS283: Governing Artificial Intelligence: Law, Policy, and Institutions"
short_title: "CS283"   # used for the browser-tab suffix on inner pages
description: >-
  Stanford CS283 — Governing Artificial Intelligence: Law, Policy, and
  Institutions. Course website.

# Public address of the course. Note this is a Stanford bl.ink *redirect*, not a
# host: it forwards (preserving the path) to cs-ai-governance.github.io/cs-283-website.
# GitHub Pages has no custom domain configured, so the site is still served from
# the project path and `baseurl` must stay the repo name or every internal link
# 404s. Moving to a real custom domain means repointing DNS off bl.ink first —
# see CLAUDE.md.
url: "https://cs283.stanford.edu"
baseurl: "/cs-283-website"

# The active offering; the schedule filters modules to this year.
current_year: 2026

# --- Build ---
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
highlighter: rouge
permalink: /:title/
timezone: America/Los_Angeles
# Lecture/module dates are in the future relative to build time; render them anyway.
future: true

# --- Collections ---
collections:
  # Weekly calendar entries (rendered inline on /schedule/, no standalone pages).
  modules:
    output: false
  # Lecture pages for the 2026 offering (archived per year).
  '2026':
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: ""
      type: modules
    values:
      layout: module
  - scope:
      path: ""
      type: '2026'
    values:
      layout: lecture

exclude:
  # Source material, not a site asset. Anything under assets/ is copied into the
  # build and reachable by URL even with nothing linking to it — and this PDF
  # still carries internal to-dos and XXX due dates. Delete this line to publish
  # it (then link it from index.md / resources.md).
  - assets/documents
  - Gemfile
  - Gemfile.lock
  - CLAUDE.md
  - README.md
  - LICENSE
  - NOTICE
  - vendor
  - .bundle
